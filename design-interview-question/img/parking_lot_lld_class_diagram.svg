<svg width="100%" viewBox="0 0 680 780" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: sans-serif; fill: #2C2C2A; }
    .th  { font-size: 14px; font-weight: 500; }
    .ts  { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
    .arr { stroke: #888780; stroke-width: 1.2; fill: none; }
    .leader { stroke: #888780; stroke-width: 0.5; stroke-dasharray: 4 3; fill: none; }

    /* Purple - Core */
    .c-purple rect  { fill: #EEEDFE; stroke: #534AB7; }
    .c-purple .th   { fill: #3C3489; }
    .c-purple .ts   { fill: #534AB7; }

    /* Teal - Spot */
    .c-teal rect  { fill: #E1F5EE; stroke: #0F6E56; }
    .c-teal .th   { fill: #085041; }
    .c-teal .ts   { fill: #0F6E56; }

    /* Coral - Vehicle */
    .c-coral rect  { fill: #FAECE7; stroke: #993C1D; }
    .c-coral .th   { fill: #712B13; }
    .c-coral .ts   { fill: #993C1D; }

    /* Amber - Ticket */
    .c-amber rect  { fill: #FAEEDA; stroke: #854F0B; }
    .c-amber .th   { fill: #633806; }
    .c-amber .ts   { fill: #854F0B; }

    /* Blue - Payment */
    .c-blue rect  { fill: #E6F1FB; stroke: #185FA5; }
    .c-blue .th   { fill: #0C447C; }
    .c-blue .ts   { fill: #185FA5; }

    /* Gray - Panel */
    .c-gray rect  { fill: #F1EFE8; stroke: #5F5E5A; }
    .c-gray .th   { fill: #444441; }
    .c-gray .ts   { fill: #5F5E5A; }
  </style>
</defs>

<!-- ParkingLot -->
<g class="c-purple">
  <rect x="240" y="20" width="200" height="70" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="44" text-anchor="middle" dominant-baseline="central">ParkingLot</text>
  <text class="ts" x="340" y="65" text-anchor="middle" dominant-baseline="central">name, address, floors[]</text>
  <text class="ts" x="340" y="80" text-anchor="middle" dominant-baseline="central">getAvailableSpot(type)</text>
</g>

<!-- ParkingFloor -->
<g class="c-purple">
  <rect x="240" y="140" width="200" height="70" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="164" text-anchor="middle" dominant-baseline="central">ParkingFloor</text>
  <text class="ts" x="340" y="183" text-anchor="middle" dominant-baseline="central">floorId, spots[]</text>
  <text class="ts" x="340" y="198" text-anchor="middle" dominant-baseline="central">getFreeSpot(type)</text>
</g>

<!-- Arrow: ParkingLot -> ParkingFloor -->
<line x1="340" y1="90" x2="340" y2="140" class="arr" marker-end="url(#arrow)" stroke="#888780"/>
<text class="ts" x="352" y="118" dominant-baseline="central">has</text>

<!-- ParkingSpot (abstract) -->
<g class="c-teal">
  <rect x="240" y="262" width="200" height="70" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="284" text-anchor="middle" dominant-baseline="central">ParkingSpot «abstract»</text>
  <text class="ts" x="340" y="303" text-anchor="middle" dominant-baseline="central">spotId, isFree, type</text>
  <text class="ts" x="340" y="318" text-anchor="middle" dominant-baseline="central">assignVehicle(v)</text>
</g>

<!-- Arrow: ParkingFloor -> ParkingSpot -->
<line x1="340" y1="210" x2="340" y2="262" class="arr" marker-end="url(#arrow)" stroke="#888780"/>
<text class="ts" x="352" y="238" dominant-baseline="central">has</text>

<!-- CompactSpot -->
<g class="c-teal">
  <rect x="40" y="390" width="140" height="50" rx="8" stroke-width="0.5"/>
  <text class="th" x="110" y="410" text-anchor="middle" dominant-baseline="central">CompactSpot</text>
  <text class="ts" x="110" y="428" text-anchor="middle" dominant-baseline="central">type=COMPACT</text>
</g>

<!-- LargeSpot -->
<g class="c-teal">
  <rect x="200" y="390" width="120" height="50" rx="8" stroke-width="0.5"/>
  <text class="th" x="260" y="410" text-anchor="middle" dominant-baseline="central">LargeSpot</text>
  <text class="ts" x="260" y="428" text-anchor="middle" dominant-baseline="central">type=LARGE</text>
</g>

<!-- HandicappedSpot -->
<g class="c-teal">
  <rect x="340" y="390" width="155" height="50" rx="8" stroke-width="0.5"/>
  <text class="th" x="417" y="410" text-anchor="middle" dominant-baseline="central">HandicappedSpot</text>
  <text class="ts" x="417" y="428" text-anchor="middle" dominant-baseline="central">type=HANDICAPPED</text>
</g>

<!-- MotorbikeSpot -->
<g class="c-teal">
  <rect x="510" y="390" width="150" height="50" rx="8" stroke-width="0.5"/>
  <text class="th" x="585" y="410" text-anchor="middle" dominant-baseline="central">MotorbikeSpot</text>
  <text class="ts" x="585" y="428" text-anchor="middle" dominant-baseline="central">type=MOTORBIKE</text>
</g>

<!-- Arrows: ParkingSpot -> children (dashed = inheritance) -->
<line x1="290" y1="332" x2="145" y2="390" class="arr" marker-end="url(#arrow)" stroke="#888780" stroke-dasharray="4 3"/>
<line x1="320" y1="332" x2="265" y2="390" class="arr" marker-end="url(#arrow)" stroke="#888780" stroke-dasharray="4 3"/>
<line x1="370" y1="332" x2="395" y2="390" class="arr" marker-end="url(#arrow)" stroke="#888780" stroke-dasharray="4 3"/>
<line x1="420" y1="332" x2="570" y2="390" class="arr" marker-end="url(#arrow)" stroke="#888780" stroke-dasharray="4 3"/>

<!-- Vehicle (abstract) -->
<g class="c-coral">
  <rect x="26" y="262" width="170" height="70" rx="8" stroke-width="0.5"/>
  <text class="th" x="111" y="284" text-anchor="middle" dominant-baseline="central">Vehicle «abstract»</text>
  <text class="ts" x="111" y="303" text-anchor="middle" dominant-baseline="central">licPlate, color, type</text>
  <text class="ts" x="111" y="318" text-anchor="middle" dominant-baseline="central">getType()</text>
</g>

<!-- Car -->
<g class="c-coral">
  <rect x="26" y="480" width="80" height="42" rx="8" stroke-width="0.5"/>
  <text class="th" x="66" y="505" text-anchor="middle" dominant-baseline="central">Car</text>
</g>
<!-- Truck -->
<g class="c-coral">
  <rect x="116" y="480" width="80" height="42" rx="8" stroke-width="0.5"/>
  <text class="th" x="156" y="505" text-anchor="middle" dominant-baseline="central">Truck</text>
</g>

<line x1="90" y1="332" x2="66" y2="480" class="arr" marker-end="url(#arrow)" stroke="#888780" stroke-dasharray="4 3"/>
<line x1="130" y1="332" x2="156" y2="480" class="arr" marker-end="url(#arrow)" stroke="#888780" stroke-dasharray="4 3"/>

<!-- ParkingTicket -->
<g class="c-amber">
  <rect x="460" y="140" width="190" height="90" rx="8" stroke-width="0.5"/>
  <text class="th" x="555" y="164" text-anchor="middle" dominant-baseline="central">ParkingTicket</text>
  <text class="ts" x="555" y="183" text-anchor="middle" dominant-baseline="central">ticketId, entryTime</text>
  <text class="ts" x="555" y="198" text-anchor="middle" dominant-baseline="central">exitTime, vehicle</text>
  <text class="ts" x="555" y="213" text-anchor="middle" dominant-baseline="central">spot, status</text>
</g>

<!-- EntrancePanel -->
<g class="c-gray">
  <rect x="460" y="262" width="190" height="70" rx="8" stroke-width="0.5"/>
  <text class="th" x="555" y="284" text-anchor="middle" dominant-baseline="central">EntrancePanel</text>
  <text class="ts" x="555" y="303" text-anchor="middle" dominant-baseline="central">panelId</text>
  <text class="ts" x="555" y="318" text-anchor="middle" dominant-baseline="central">printTicket(vehicle)</text>
</g>

<!-- ExitPanel -->
<g class="c-gray">
  <rect x="460" y="360" width="190" height="70" rx="8" stroke-width="0.5"/>
  <text class="th" x="555" y="382" text-anchor="middle" dominant-baseline="central">ExitPanel</text>
  <text class="ts" x="555" y="401" text-anchor="middle" dominant-baseline="central">panelId</text>
  <text class="ts" x="555" y="416" text-anchor="middle" dominant-baseline="central">processPayment(ticket)</text>
</g>

<!-- ParkingRate -->
<g class="c-blue">
  <rect x="460" y="458" width="190" height="70" rx="8" stroke-width="0.5"/>
  <text class="th" x="555" y="480" text-anchor="middle" dominant-baseline="central">ParkingRate</text>
  <text class="ts" x="555" y="499" text-anchor="middle" dominant-baseline="central">ratePerHour</text>
  <text class="ts" x="555" y="514" text-anchor="middle" dominant-baseline="central">calculateFee(ticket)</text>
</g>

<!-- Payment (abstract) -->
<g class="c-blue">
  <rect x="460" y="560" width="190" height="70" rx="8" stroke-width="0.5"/>
  <text class="th" x="555" y="582" text-anchor="middle" dominant-baseline="central">Payment «abstract»</text>
  <text class="ts" x="555" y="601" text-anchor="middle" dominant-baseline="central">amount, status</text>
  <text class="ts" x="555" y="616" text-anchor="middle" dominant-baseline="central">processPayment()</text>
</g>

<!-- CashPayment -->
<g class="c-blue">
  <rect x="460" y="660" width="88" height="42" rx="8" stroke-width="0.5"/>
  <text class="th" x="504" y="685" text-anchor="middle" dominant-baseline="central">Cash</text>
</g>
<!-- CardPayment -->
<g class="c-blue">
  <rect x="562" y="660" width="88" height="42" rx="8" stroke-width="0.5"/>
  <text class="th" x="606" y="685" text-anchor="middle" dominant-baseline="central">Card</text>
</g>

<!-- Right-side vertical connections -->
<line x1="555" y1="230" x2="555" y2="262" class="arr" marker-end="url(#arrow)" stroke="#888780"/>
<line x1="555" y1="332" x2="555" y2="360" class="arr" marker-end="url(#arrow)" stroke="#888780"/>
<line x1="555" y1="430" x2="555" y2="458" class="arr" marker-end="url(#arrow)" stroke="#888780"/>
<line x1="555" y1="528" x2="555" y2="560" class="arr" marker-end="url(#arrow)" stroke="#888780"/>
<line x1="520" y1="630" x2="504" y2="660" class="arr" marker-end="url(#arrow)" stroke="#888780" stroke-dasharray="4 3"/>
<line x1="590" y1="630" x2="606" y2="660" class="arr" marker-end="url(#arrow)" stroke="#888780" stroke-dasharray="4 3"/>

<!-- ParkingLot to Ticket -->
<line x1="440" y1="55" x2="460" y2="155" class="arr" marker-end="url(#arrow)" stroke="#888780"/>

<!-- Legend -->
<text class="ts" x="40" y="730" dominant-baseline="central">Legend:</text>
<line x1="96" y1="730" x2="130" y2="730" class="arr" marker-end="url(#arrow)" stroke="#888780"/>
<text class="ts" x="134" y="730" dominant-baseline="central">association</text>
<line x1="220" y1="730" x2="260" y2="730" class="arr" marker-end="url(#arrow)" stroke="#888780" stroke-dasharray="4 3"/>
<text class="ts" x="264" y="730" dominant-baseline="central">inheritance / extends</text>

<!-- Color key -->
<rect x="40"  y="750" width="12" height="12" rx="2" fill="#7F77DD"/>
<text class="ts" x="58"  y="759" dominant-baseline="central">Core</text>
<rect x="100" y="750" width="12" height="12" rx="2" fill="#1D9E75"/>
<text class="ts" x="118" y="759" dominant-baseline="central">Spot</text>
<rect x="158" y="750" width="12" height="12" rx="2" fill="#D85A30"/>
<text class="ts" x="176" y="759" dominant-baseline="central">Vehicle</text>
<rect x="230" y="750" width="12" height="12" rx="2" fill="#BA7517"/>
<text class="ts" x="248" y="759" dominant-baseline="central">Ticket</text>
<rect x="290" y="750" width="12" height="12" rx="2" fill="#378ADD"/>
<text class="ts" x="308" y="759" dominant-baseline="central">Payment</text>
<rect x="370" y="750" width="12" height="12" rx="2" fill="#888780"/>
<text class="ts" x="388" y="759" dominant-baseline="central">Panel</text>
</svg>
